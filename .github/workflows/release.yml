# Automated semantic release for pyDeepLearn.
#
# Every push to main is parsed with the Conventional Commits specification
# (https://www.conventionalcommits.org/). When a release-worthy commit is found
# (`feat:` -> minor, `fix:`/`perf:` -> patch, `!`/`BREAKING CHANGE:` -> major)
# python-semantic-release:
#
#   1. determines the next SemVer version,
#   2. stamps it into pyproject.toml and docs/conf.py,
#   3. regenerates CHANGELOG.md,
#   4. runs `uv build` to produce the wheel and sdist,
#   5. commits the changed files, tags the commit `vX.Y.Z` and pushes both,
#   6. publishes a GitHub release with the changelog notes, and
#   7. attaches the built wheel and sdist to that release
#      (`semantic-release publish`).
#
# Commits that do not follow the convention (or that only carry `docs:`,
# `chore:`, `ci:`, `test:`, `style:` prefixes) do not trigger a release.
# Run `make release-check` locally to preview the next release.
#
# See https://python-semantic-release.readthedocs.io/ for the full reference.
# The automated documentation build lives in .github/workflows/docs.yml and the
# test/lint/package checks live in .github/workflows/python-app.yml.
#
# Every action is pinned to a release that runs on Node.js 24 (the runners
# remove Node.js 20 on 2026-09-23):
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/

name: Semantic Release

on:
  # Every push to main is evaluated; a release is only cut when the commit
  # messages call for one.
  push:
    branches: [ "main" ]
  # Manual runs are useful for retrying a release whose push failed.
  workflow_dispatch:

# Least privilege: each job requests what it needs.
permissions:
  contents: read

# Releases must not be cancelled halfway through, so this group deliberately
# does not cancel in-progress runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:

    name: Version, changelog, tag and GitHub release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        # python-semantic-release needs the full history and all tags to work
        # out the current version.
        fetch-depth: 0
    - name: Install uv
      # v7 is the newest release line that still publishes a major tag (v8 and
      # later dropped them) and it already runs on Node.js 24.
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.12"
    - name: Install dependencies
      run: uv sync --group release
    - name: Verify the GitHub token
      env:
        # The environment variable named by `remote.token` in pyproject.toml.
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A token that cannot be used is only reported by python-semantic-release
      # *after* it has pushed the release commit and the tag, which leaves a tag
      # without a release (see the `remote.token` note in pyproject.toml). Check
      # it up front instead, so nothing is pushed when the token is unusable.
      run: |
        if [ -z "${GH_TOKEN}" ]; then
          echo "GH_TOKEN is empty, python-semantic-release cannot create the release" >&2
          exit 1
        fi
        status=$(curl -sS -o /dev/null -w '%{http_code}' \
          -H "Authorization: token ${GH_TOKEN}" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/${{ github.repository }}")
        echo "GitHub API answered HTTP ${status} for the workflow token"
        [ "${status}" = "200" ]
    - name: Run python-semantic-release
      id: release
      env:
        # The environment variable named by `remote.token` in pyproject.toml.
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # In CI the version command commits, tags, pushes, and publishes the
      # GitHub release by default (the same defaults the official
      # python-semantic-release action relies on).
      run: uv run --group release semantic-release -v version
    - name: Attach the wheel and sdist to the GitHub release
      if: steps.release.outputs.released == 'true'
      env:
        # The environment variable named by `remote.token` in pyproject.toml.
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `semantic-release version` builds dist/ with `uv build` and creates the
      # release, but attaching the artifacts is the job of the publish command:
      # it uploads everything matching
      # [tool.semantic_release.publish].dist_glob_patterns (the wheel and the
      # sdist) to the release for the tag that was just cut.
      run: uv run --group release semantic-release publish --tag "${{ steps.release.outputs.tag }}"
    - name: Verify the wheel is attached to the release
      if: steps.release.outputs.released == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `semantic-release publish` only logs a warning when it cannot find the
      # release for the tag, so assert here that the wheel really did become a
      # release asset instead of exiting successfully with nothing attached.
      run: |
        curl -sS -H "Authorization: token ${GH_TOKEN}" \
          -H 'Accept: application/vnd.github+json' \
          -o /tmp/release.json \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.release.outputs.tag }}"
        python3 - <<'PY'
        import json

        with open("/tmp/release.json") as handle:
          release = json.load(handle)

        assets = [asset["name"] for asset in release.get("assets", [])]
        print("release assets:", *assets or ["(none)"])
        if not any(name.endswith(".whl") for name in assets):
          raise SystemExit("no wheel attached to the release")
        PY
    - name: Summary
      run: |
        echo "### Semantic release" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "- released: \`${{ steps.release.outputs.released }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- version: \`${{ steps.release.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- tag: \`${{ steps.release.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
        if [ "${{ steps.release.outputs.released }}" = "true" ]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Distributions attached to the release:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for file in dist/*.whl dist/*.tar.gz; do
            [ -f "$file" ] || continue
            echo "- \`$(basename "$file")\` ($(du -h "$file" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          done
        fi
    - name: Upload the distributions
      if: steps.release.outputs.released == 'true'
      # v6 is the first release that runs on Node.js 24 by default.
      uses: actions/upload-artifact@v6
      with:
        name: dist
        path: dist/

  publish:

    name: Publish to PyPI
    needs: release
    # Opt-in: set the repository variable PUBLISH_TO_PYPI to "true" and register
    # a PyPI trusted publisher for this workflow before this job does anything.
    # https://docs.astral.sh/uv/guides/integration/github/#publishing-to-pypi
    if: needs.release.outputs.released == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/pydeeplearn

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false
        python-version: "3.12"
    - name: Download the distributions
      # v7 is the first release that runs on Node.js 24 by default.
      uses: actions/download-artifact@v7
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      # Trusted publishing: no API token is required, the runner exchanges an
      # OIDC token for a short-lived PyPI credential.
      run: uv publish
