# Automated semantic release for pyDeepLearn.
#
# Every push to main is parsed with the Conventional Commits specification
# (https://www.conventionalcommits.org/). When a release-worthy commit is found
# (`feat:` -> minor, `fix:`/`perf:` -> patch, `!`/`BREAKING CHANGE:` -> major)
# python-semantic-release:
#
#   1. determines the next SemVer version,
#   2. stamps it into pyproject.toml and docs/conf.py,
#   3. regenerates CHANGELOG.md,
#   4. runs `uv build` to produce the wheel and sdist,
#   5. commits the changed files, tags the commit `vX.Y.Z` and pushes both,
#   6. publishes a GitHub release with the changelog notes and the built
#      distributions attached.
#
# Commits that do not follow the convention (or that only carry `docs:`,
# `chore:`, `ci:`, `test:`, `style:` prefixes) do not trigger a release.
# Run `make release-check` locally to preview the next release.
#
# See https://python-semantic-release.readthedocs.io/ for the full reference.
# The automated documentation build lives in .github/workflows/docs.yml and the
# test/lint/package checks live in .github/workflows/python-app.yml.

name: Semantic Release

on:
  # Every push to main is evaluated; a release is only cut when the commit
  # messages call for one.
  push:
    branches: [ "main" ]
  # Manual runs are useful for retrying a release whose push failed.
  workflow_dispatch:

# Least privilege: each job requests what it needs.
permissions:
  contents: read

# Releases must not be cancelled halfway through, so this group deliberately
# does not cancel in-progress runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:

    name: Version, changelog, tag and GitHub release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # python-semantic-release needs the full history and all tags to work
        # out the current version.
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: "3.12"
    - name: Install dependencies
      run: uv sync --group release
    - name: Run python-semantic-release
      id: release
      env:
        # The environment variable named by `remote.token` in pyproject.toml.
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # In CI the version command commits, tags, pushes, and publishes the
      # GitHub release by default (the same defaults the official
      # python-semantic-release action relies on).
      run: uv run --group release semantic-release -v version
    - name: Summary
      run: |
        echo "### Semantic release" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "- released: \`${{ steps.release.outputs.released }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- version: \`${{ steps.release.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- tag: \`${{ steps.release.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload the distributions
      if: steps.release.outputs.released == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:

    name: Publish to PyPI
    needs: release
    # Opt-in: set the repository variable PUBLISH_TO_PYPI to "true" and register
    # a PyPI trusted publisher for this workflow before this job does anything.
    # https://docs.astral.sh/uv/guides/integration/github/#publishing-to-pypi
    if: needs.release.outputs.released == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/pydeeplearn

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: false
        python-version: "3.12"
    - name: Download the distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      # Trusted publishing: no API token is required, the runner exchanges an
      # OIDC token for a short-lived PyPI credential.
      run: uv publish
