# Continuous integration: installs the locked dependencies with uv, lints with
# flake8, runs the unit test suite on every supported Python version, and builds
# the wheel/sdist -- the `package` job also verifies that the wheel installs and
# passes the test suite it ships, and uploads it as a downloadable artifact.
#
# Documentation is built and published by .github/workflows/docs.yml, and
# releases are cut by .github/workflows/release.yml.
# For more information see: https://docs.astral.sh/uv/guides/integration/github/
#
# Every action is pinned to a release that runs on Node.js 24 (the runners
# remove Node.js 20 on 2026-09-23):
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      # v7 is the newest release line that still publishes a major tag (v8 and
      # later dropped them) and it already runs on Node.js 24.
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.12"
    - name: Install dependencies
      # Only the dev group (flake8) is needed to lint; the docs and release
      # groups are installed by their own workflows.
      run: uv sync --group dev
    - name: Lint with flake8
      # Configuration (127 character lines, the package's two-space indent
      # style, and .venv/dist/docs/_build excluded) lives in .flake8.
      # This step must stay clean.
      run: uv run flake8 .
    - name: Report cyclomatic complexity
      # Advisory only: functions with a complexity above 10 are reported to the
      # log but never fail the build.
      run: uv run flake8 . --max-complexity=10 --exit-zero --statistics

  test:

    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report the result of every interpreter instead of stopping at the first
      # failure.
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      # Only the dev group is needed to run the unit test suite; the docs and
      # release groups are installed by their own workflows.
      run: uv sync --group dev
    - name: Test with unittest
      run: uv run python -m unittest discover -s pyDeepLearn

  package:

    name: Build distribution
    runs-on: ubuntu-latest

    outputs:
      # The wheel that this job built, e.g. pydeeplearn-1.2.3-py3-none-any.whl.
      wheel: ${{ steps.wheel.outputs.name }}

    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.12"
    - name: Build the wheel and sdist
      # `uv build` runs hatchling (see [build-system] in pyproject.toml) and
      # writes dist/pydeeplearn-<version>-py3-none-any.whl -- the installable
      # wheel -- plus the matching source distribution.
      run: uv build
    - name: Locate the wheel
      id: wheel
      # A fresh checkout starts with an empty dist/, so exactly one wheel is
      # expected. Failing here is clearer than uploading nothing, and the
      # outputs let the later steps and the run summary name the file.
      run: |
        wheels=(dist/*.whl)
        if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
          echo "expected exactly one wheel in dist/, found: ${wheels[*]}" >&2
          exit 1
        fi
        echo "wheel=${wheels[0]}" >> "$GITHUB_OUTPUT"
        echo "name=$(basename "${wheels[0]}")" >> "$GITHUB_OUTPUT"
    - name: Verify the wheel installs and passes the test suite
      # The wheel has to stand on its own, so install it into a throwaway
      # environment outside the checkout -- where `import pyDeepLearn` cannot
      # silently fall back to the source tree -- and then run the test suite
      # that ships inside it against the installed copy. A wheel that is
      # missing modules or test data fails the build here.
      run: |
        cd "$RUNNER_TEMP"
        uv venv --python 3.12 wheel-venv
        uv pip install --python wheel-venv/bin/python "$GITHUB_WORKSPACE/${{ steps.wheel.outputs.wheel }}"
        package_dir=$(wheel-venv/bin/python -c "import os, pyDeepLearn; print(os.path.dirname(pyDeepLearn.__file__))")
        wheel-venv/bin/python -m unittest discover -s "$package_dir"
    - name: Summarize the built distributions
      run: |
        {
          echo "### Built distributions"
          echo ""
          echo "| File | Size | SHA-256 |"
          echo "| --- | --- | --- |"
          for file in dist/*.whl dist/*.tar.gz; do
            [ -f "$file" ] || continue
            echo "| \`$(basename "$file")\` | $(du -h "$file" | cut -f1) | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
          done
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload the wheel
      # The wheel on its own, so it can be downloaded without unpacking the
      # full distribution set.
      # v6 is the first release that runs on Node.js 24 by default.
      uses: actions/upload-artifact@v6
      with:
        name: wheel
        path: "${{ steps.wheel.outputs.wheel }}"
    - name: Upload the wheel and sdist
      uses: actions/upload-artifact@v6
      with:
        name: dist
        path: dist/
