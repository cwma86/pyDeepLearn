# Manual (workflow_dispatch) backfill for tags that have no GitHub release or
# whose release is missing the wheel/sdist -- for example the versions that were
# cut while `[tool.semantic_release.remote].token` was still the literal string
# "GH_TOKEN", which made python-semantic-release fail every time it tried to
# create the release. It builds the artifacts at the given tag and creates or
# updates that tag's release with them attached.
#
# Run it from Actions -> Release assets -> Run workflow, and enter the tag to
# attach the wheel to (for example `v1.1.0`). The workflow has to be on the
# default branch before it can be dispatched.
#
# Releases themselves are cut by .github/workflows/release.yml; this workflow
# only (re)attaches the built artifacts to an existing tag.
#
# Every action is pinned to a release that runs on Node.js 24 (the runners
# remove Node.js 20 on 2026-09-23):
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/

name: Release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach the wheel and sdist to (for example v1.1.0)
        required: true
        type: string

# Writing release assets needs contents: write.
permissions:
  contents: read

# A backfill must not be cancelled halfway through either.
concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attach:

    name: Attach the wheel and sdist to ${{ inputs.tag }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout the tag
      uses: actions/checkout@v5
      with:
        # Build the version that was stamped into the tag, not whatever the
        # default branch holds now.
        ref: ${{ inputs.tag }}
        fetch-depth: 0
    - name: Install uv
      # v7 is the newest release line that still publishes a major tag (v8 and
      # later dropped them) and it already runs on Node.js 24.
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.12"
    - name: Build the wheel and sdist for the tag
      run: uv build
    - name: Create or update the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `gh` is preinstalled on the GitHub-hosted runners. `--verify-tag` stops
      # the run if the tag does not exist, so a typo cannot invent a tag, and
      # `--clobber` makes re-running this workflow safe.
      run: |
        if ! gh release view "${{ inputs.tag }}" > /dev/null 2>&1; then
          gh release create "${{ inputs.tag }}" \
            --verify-tag \
            --title "${{ inputs.tag }}" \
            --generate-notes
        fi
        gh release upload "${{ inputs.tag }}" dist/*.whl dist/*.tar.gz --clobber
        gh release view "${{ inputs.tag }}" --json assets --jq '.assets[].name'
