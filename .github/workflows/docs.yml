# Generates the Sphinx API documentation from the NumPy-style docstrings for
# every pull request and every push to main, and publishes the generated HTML
# to GitHub Pages from main.
#
# One-time repository setup: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". The configure-pages step below also tries to turn
# Pages on automatically the first time this workflow runs.

name: Documentation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: "3.12"
    - name: Install dependencies
      run: uv sync --all-groups
    - name: Build the API documentation
      run: uv run --group docs sphinx-build -b html docs docs/_build/html
    - name: Upload the generated documentation
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: docs/_build/html/

  deploy:

    name: Publish to GitHub Pages
    # Only publish from main; pull requests only build the documentation.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Download the generated documentation
      uses: actions/download-artifact@v4
      with:
        name: docs-html
        path: docs/_build/html
    - name: Disable Jekyll processing
      # Pages serves the artifact as static files, so this is a safety net for
      # Sphinx's `_static`/`_sources`/`_modules` directories. It is created here
      # (rather than before the artifact upload) because artifacts skip hidden
      # files by default.
      run: touch docs/_build/html/.nojekyll
    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5
      with:
        # Try to enable Pages (Source: "GitHub Actions") if it is not on yet.
        enablement: true
    - name: Upload the Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build/html
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
