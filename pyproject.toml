[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyDeepLearn"
# Version is a single source of truth: python-semantic-release stamps it from
# the Conventional Commit history on every release (see [tool.semantic_release]).
version = "1.1.0"
description = "A from-scratch NumPy deep learning framework built to investigate the inner workings of ML frameworks"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Cory W. Mauer", email = "cwm63@drexel.edu" },
]
keywords = [
    "deep-learning",
    "machine-learning",
    "neural-network",
    "numpy",
    "education",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.22.1",
    "matplotlib>=3.5.1",
]

[project.urls]
Homepage = "https://github.com/cwma86/pyDeepLearn"
Repository = "https://github.com/cwma86/pyDeepLearn.git"
Issues = "https://github.com/cwma86/pyDeepLearn/issues"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "flake8>=4.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]
release = [
    "python-semantic-release>=9.21,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["pyDeepLearn"]

[tool.hatch.build.targets.sdist]
include = [
    "/pyDeepLearn",
    "/main.py",
    "/README.md",
    "/LICENSE",
    "/makefile",
    "/docs",
]

[tool.pytest.ini_options]
testpaths = ["pyDeepLearn"]

# Automated semantic release. Commit messages must follow the Conventional
# Commits specification (https://www.conventionalcommits.org/): `feat:` bumps
# the minor version, `fix:` and `perf:` bump the patch version, and a `!` (or a
# `BREAKING CHANGE:` footer) bumps the major version.
# Run `make release-check` to preview the next release without changing
# anything, or see .github/workflows/release.yml for the CI/CD wiring.
[tool.semantic_release]
# Stamp the new version into the build metadata and the Sphinx configuration so
# that the wheel, the sdist, and the published documentation stay in sync.
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "docs/conf.py:release",
    "docs/conf.py:version",
]
# Build the artifacts with the same tool uv that manages the project; the
# wheel and the sdist are attached to the GitHub release.
build_command = "uv build"
commit_parser = "conventional"
tag_format = "v{version}"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
# Author of the release commit. python-semantic-release expects a single
# "name <email>" string (or { env = "SOME_VAR" }).
commit_author = "github-actions <github-actions@users.noreply.github.com>"
# pyDeepLearn is already past 1.0, so no automated release may be a 0.x version.
# Without this, the very first release of a tag-less repository is 0.0.0.
allow_zero_version = false

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.changelog]
# Release notes are inserted where the `<!-- version list -->` marker lives.
# The file is created from scratch the first time it is generated.
mode = "update"

[tool.semantic_release.remote]
type = "github"
# Name of the environment variable holding the token used to push the release
# commit/tag and to create the GitHub release.
token = "GH_TOKEN"
ignore_token_for_push = false

[tool.semantic_release.publish]
# `semantic-release version` builds these files with `uv build` (see
# build_command above); the `publish` command in release.yml uploads exactly
# these patterns to the GitHub release for the tag that was just cut, so the
# wheel and the sdist are attached to every release.
dist_glob_patterns = ["dist/*.whl", "dist/*.tar.gz"]
